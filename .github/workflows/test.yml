name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core poppler-utils
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python examples/create_demo.py && cad-print export demo.dxf -o result/demo.pdf --preview
      - run: cad-model build examples/reviewed_geometry.json -o result/pipeline --preview
