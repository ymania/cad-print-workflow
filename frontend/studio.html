<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data: blob:; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>图上建图 · CAD 助手</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="studio.css"><script src="core.js" defer></script><script src="studio-core.js" defer></script><script src="studio.js" defer></script></head><body><header><div class="brand"><b>CA</b><div>图上建图<small>第一阶段 · 手动校正与参数化构造</small></div></div><a href="index.html">返回模型识图助手</a></header><main><section class="panel body"><h1>先校正、再定尺寸，最后画图。</h1><p>本页不调用模型、不上传图片。当前支持直线、圆、正六边形和正五角星；圆弧相切、自动轮廓识别和尺寸标注尚未接入。</p><div class="actions"><label>选择一张图纸<input id="photo" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="sample">使用合成测试图</button><button id="save">保存项目</button><label>恢复项目<input id="load" type="file" accept=".json"></label></div><p id="notice" role="status">请导入图片，或使用测试图体验。</p></section><div class="studio-layout"><section class="panel body"><div class="actions"><label><input id="grid" type="checkbox" checked>坐标网格</label><label><input id="overlay" type="checkbox" checked>几何叠图</label><button id="undo">撤销建图/尺寸修改</button></div><canvas id="board" width="1000" height="707" aria-label="图纸交互画布"></canvas><p>网格为图像定位辅助，不代表毫米。绿线是程序生成的几何，红点是当前选择。</p></section><aside class="panel body"><h2>1 · 校正纸面</h2><p>沿左上→右上→右下→左下点四个角。选错可重新开始。局部图不要强行套纸张比例。</p><label>校正后宽高比<select id="ratio"><option value="1.41421356237">A3横向</option><option value="0.70710678118">A3纵向</option><option value="1">正方形</option></select></label><div class="actions"><button id="corners">重新选四角</button><button id="warp">执行校正</button><button id="skip">原图已正 / 使用局部图</button></div><h2>2 · 标定实际尺寸</h2><label>两点实际距离（mm）<input id="known" type="number" min="0.001" value="80" step="any"></label><button id="calibrate">点选两个尺寸端点</button><p id="calibration">未标定</p><h2>3 · 点选构造</h2><label>图形<select id="kind"><option value="line">直线：起点→终点</option><option value="circle">圆：圆心→圆周</option><option value="hexagon">正六边形：中心→顶点</option><option value="star">正五角星：中心→顶点</option></select></label><button id="draw">开始点选</button><div id="shapes"></div><h2>4 · 核对与导出</h2><label>纸面放大倍数<input id="scale" type="number" min="0.01" max="100" value="1" step="any"></label><p>实际尺寸不变；3代表3:1。自动移至A3纸内10mm处，超出页面会报错。</p><label><input id="confirmed" type="checkbox">已核对全部图形及尺寸</label><button id="export">生成DXF、PDF与参数</button><div id="downloads"></div></aside></div></main></body></html>
