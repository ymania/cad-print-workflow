[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cad-print-workflow"
version = "0.3.0"
description = "Inspect 2D DXF and export verified, monochrome A3 vector PDFs"
requires-python = ">=3.10"
dependencies = ["ezdxf>=1.4,<2", "reportlab>=4,<5", "pypdf>=5,<7", "fonttools>=4,<5"]
[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["httpx>=0.28,<1", "fastapi>=0.115,<1", "pytest>=8,<10", "pymupdf>=1.24,<2"]
[project.scripts]
cad-job = "cad_print_workflow.delivery:main"
cad-print = "cad_print_workflow.cli:main"
cad-assistant = "cad_print_workflow.web:main"
cad-model = "cad_print_workflow.pipeline:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cad_print_workflow = ["static/*"]
