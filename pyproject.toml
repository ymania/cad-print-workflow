[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cad-print-workflow"
version = "0.1.0"
description = "Inspect 2D DXF and export verified, monochrome A3 vector PDFs"
requires-python = ">=3.10"
dependencies = ["ezdxf>=1.4,<2", "reportlab>=4,<5", "pypdf>=5,<7", "fonttools>=4,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pymupdf>=1.24,<2"]
[project.scripts]
cad-print = "cad_print_workflow.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
